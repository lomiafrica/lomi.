name: lomi · require check

on:
  workflow_call:

permissions:
  contents: read
  checks: read

jobs:
  require-check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts/wait-for-check.mjs
      - name: Wait for lomi · check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/wait-for-check.mjs "lomi · check"
