name: lomi · ci · jumbo

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/jumbo"
      - "apps/jumbo/**"
      - "packages/shared/**"
      - "packages/queries/**"
      - "tooling/scripts/install-app-with-packages.mjs"
      - ".github/workflows/app-ci-jumbo.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/jumbo"
      - "apps/jumbo/**"
      - "packages/shared/**"
      - "packages/queries/**"
      - "tooling/scripts/install-app-with-packages.mjs"
      - ".github/workflows/app-ci-jumbo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/jumbo
    steps:
      - uses: actions/checkout@v5

      - name: Checkout jumbo submodule
        working-directory: .
        env:
          TOKEN: ${{ secrets.REPO_CHECKOUT_PAT }}
        run: bash .github/scripts/init-submodules.sh packages apps/jumbo

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            apps/jumbo/pnpm-lock.yaml
            packages/shared/package.json
            packages/queries/package.json

      - name: Install Jumbo + shared packages
        working-directory: .
        run: node tooling/scripts/install-app-with-packages.mjs apps/jumbo

      - name: Lint
        run: pnpm lint

      - name: Knip
        run: pnpm knip

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - uses: expo/expo-github-action@v8
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish PR preview OTA
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: ota
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          msg=$(printf 'PR #%s %s' "${{ github.event.number }}" "${{ github.event.pull_request.title }}" | cut -c1-80)
          eas update --branch "pr-${{ github.event.number }}" --environment preview --non-interactive --json --message "$msg" | tee /tmp/eas-update.json
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Comment EAS links
        if: github.event_name == 'pull_request' && steps.ota.outputs.published == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- jumbo-eas-preview -->';
            const n = context.payload.pull_request.number;
            const body = [
              marker,
              '### Jumbo preview',
              '',
              'JS/copy/UI from this PR is on EAS Update branch `pr-' + n + '`.',
              'Install the latest preview binary, then this update applies on next launch.',
              '',
              '- [EAS updates](https://expo.dev/accounts/lomiafrica/projects/lomi/updates)',
              '- [EAS builds](https://expo.dev/accounts/lomiafrica/projects/lomi/builds)',
              '',
              'Native changes (permissions, new native modules, SDK bumps) still need a new binary: Actions → lomi · deploy · jumbo → `preview`.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              body,
            });

