name: lomi · deploy · docs

on:
  repository_dispatch:
    types: [lomi-deploy-docs]
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tooling/scripts/install-app-with-packages.mjs"
      - ".github/workflows/app-deploy-cloudflare.yml"
      - ".github/workflows/app-deploy-docs.yml"
      - ".github/scripts/init-submodules.sh"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        type: string
        default: main

concurrency:
  group: lomi-deploy-docs-${{ github.event.client_payload.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.client_payload.sha || inputs.ref || github.sha }}
      - name: Checkout workspace packages
        env:
          REPO_CHECKOUT_PAT: ${{ secrets.REPO_CHECKOUT_PAT }}
        run: bash .github/scripts/init-submodules.sh packages
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/docs/pnpm-lock.yaml
      - name: Install docs with workspace packages
        run: node tooling/scripts/install-app-with-packages.mjs apps/docs
      - run: pnpm lint
        working-directory: apps/docs
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    needs: verify
    if: |
      github.event.client_payload.target == 'production' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.client_payload.sha || inputs.ref || github.sha }}
      - name: Checkout workspace packages
        env:
          REPO_CHECKOUT_PAT: ${{ secrets.REPO_CHECKOUT_PAT }}
        run: bash .github/scripts/init-submodules.sh packages
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install docs with workspace packages
        run: node tooling/scripts/install-app-with-packages.mjs apps/docs
      - name: Deploy docs to Cloudflare Workers
        working-directory: apps/docs
        env:
          CLOUDFLARE_ACCOUNT_ID: f3ec53105d62084311b236c7b22a61c1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec vinext-cloudflare deploy
      - name: Record production URL
        env:
          APP: docs
        run: node .github/scripts/publish-production-url.mjs
      - name: Verify shipped Supabase key
        env:
          APP: docs
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node .github/scripts/verify-shipped-supabase-key.mjs
