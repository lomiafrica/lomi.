name: lomi · check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: lomi · check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Checkout submodules
        env:
          REPO_CHECKOUT_PAT: ${{ secrets.REPO_CHECKOUT_PAT }}
        run: |
          set -euo pipefail
          bash .github/scripts/init-submodules.sh \
            packages \
            apps/dashboard \
            apps/admin \
            apps/website \
            apps/checkout \
            apps/storefront \
            apps/customers \
            apps/api \
            apps/jumbo
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Lint, typecheck, and format each app
        run: |
          set -euo pipefail
          fail=0
          check_dir() {
            local dir="$1"
            [ -f "$dir/package.json" ] || return 0
            node tooling/scripts/install-app-with-packages.mjs "$dir"
            for script in lint typecheck format; do
              node --input-type=module -e "import {readFileSync} from 'node:fs'; const s=JSON.parse(readFileSync('$dir/package.json','utf8')).scripts||{}; process.exit(s['$script']?0:1)" || continue
              echo "==> $dir ($script)"
              pnpm --dir "$dir" --ignore-workspace run "$script" || fail=1
            done
          }
          while IFS= read -r dir; do
            check_dir "$dir"
          done <<'EOF'
          apps/dashboard
          apps/admin
          apps/website
          apps/docs
          apps/checkout
          apps/storefront
          apps/customers
          apps/api
          apps/mcp
          apps/jumbo
          apps/sdks/ts
          apps/sdks/embed
          EOF
          for dir in packages/pay packages/receipt-pdf; do
            pnpm --dir "$dir" install --ignore-workspace --no-frozen-lockfile
            for script in lint typecheck format; do
              node --input-type=module -e "import {readFileSync} from 'node:fs'; const s=JSON.parse(readFileSync('$dir/package.json','utf8')).scripts||{}; process.exit(s['$script']?0:1)" || continue
              echo "==> $dir ($script)"
              pnpm --dir "$dir" --ignore-workspace run "$script" || fail=1
            done
          done
          [ "$fail" = 0 ]
      - name: Anti-slop
        run: |
          npm install --prefix "$RUNNER_TEMP/oxlint" oxlint@1.78.0 @oxlint/plugins@1.78.0
          "$RUNNER_TEMP/oxlint/node_modules/.bin/oxlint" .
