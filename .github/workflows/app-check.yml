name: lomi · check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: lomi · check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Checkout submodules
        env:
          REPO_CHECKOUT_PAT: ${{ secrets.REPO_CHECKOUT_PAT }}
        run: |
          set -euo pipefail
          bash .github/scripts/init-submodules.sh \
            packages \
            apps/dashboard \
            apps/admin \
            apps/website \
            apps/checkout \
            apps/storefront \
            apps/customers \
            apps/api \
            apps/jumbo
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install each app
        run: |
          set -euo pipefail
          while IFS= read -r dir; do
            [ -f "$dir/package.json" ] || continue
            node tooling/scripts/install-app-with-packages.mjs "$dir"
          done <<'EOF'
          apps/dashboard
          apps/admin
          apps/website
          apps/docs
          apps/checkout
          apps/storefront
          apps/customers
          apps/api
          apps/mcp
          apps/jumbo
          apps/sdks/ts
          apps/sdks/embed
          packages/pay
          packages/receipt-pdf
          EOF
      - name: Lint
        run: node tooling/scripts/workspace.mjs lint
      - name: Typecheck
        run: node tooling/scripts/workspace.mjs typecheck
      - name: Format
        run: node tooling/scripts/workspace.mjs format
      - name: Anti-slop
        run: |
          npm install --prefix "$RUNNER_TEMP/oxlint" oxlint@1.78.0 @oxlint/plugins@1.78.0
          "$RUNNER_TEMP/oxlint/node_modules/.bin/oxlint" .
