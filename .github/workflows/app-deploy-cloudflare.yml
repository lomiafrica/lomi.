name: lomi · deploy · cloudflare

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      repository:
        required: true
        type: string
      submodule-path:
        required: true
        type: string
      working-directory-mode:
        required: true
        type: string
      extra-submodules:
        required: false
        type: string
        default: ""
      workflow-ref:
        required: false
        type: string
        default: ""
      deploy-kind:
        description: "vinext (Next.js apps) or static (Vite SPAs)"
        required: true
        type: string
      pnpm-version:
        required: false
        type: string
        default: "12"
    secrets:
      REPO_CHECKOUT_PAT:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: f3ec53105d62084311b236c7b22a61c1

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Load local actions
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions/checkout-app-submodule

      - name: Checkout umbrella + app source
        id: checkout-app
        uses: ./.github/actions/checkout-app-submodule
        with:
          repository: ${{ inputs.repository }}
          submodule-path: ${{ inputs.submodule-path }}
          token: ${{ secrets.REPO_CHECKOUT_PAT }}
          event-name: ${{ github.event_name }}
          workflow-ref: ${{ inputs.workflow-ref }}
          dispatch-sha: ${{ github.event.client_payload.sha }}
          with-umbrella: "true"

      - name: Checkout extra submodules
        if: inputs.extra-submodules != ''
        env:
          REPO_CHECKOUT_PAT: ${{ secrets.REPO_CHECKOUT_PAT }}
        run: bash .github/scripts/init-submodules.sh ${{ inputs.extra-submodules }}

      - name: Resolve app directory
        id: wd
        run: echo "dir=${GITHUB_WORKSPACE}/${{ steps.checkout-app.outputs.app-path }}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app with workspace packages
        run: node tooling/scripts/install-app-with-packages.mjs ${{ inputs.submodule-path }}

      - name: Deploy vinext app to Cloudflare Workers
        if: inputs.deploy-kind == 'vinext'
        working-directory: ${{ steps.wd.outputs.dir }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec vinext-cloudflare deploy

      - name: Build static SPA
        if: inputs.deploy-kind == 'static'
        working-directory: ${{ steps.wd.outputs.dir }}
        run: pnpm build

      - name: Deploy static SPA to Cloudflare Workers
        if: inputs.deploy-kind == 'static'
        working-directory: ${{ steps.wd.outputs.dir }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@4 deploy

      - name: Record production URL
        env:
          APP: ${{ inputs.app }}
        run: node .github/scripts/publish-production-url.mjs

      - name: Verify shipped Supabase key
        env:
          APP: ${{ inputs.app }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node .github/scripts/verify-shipped-supabase-key.mjs
