name: lomi · ci · assistant live

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assistant-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Init private submodules
        env:
          REPO_CHECKOUT_PAT: ${{ secrets.REPO_CHECKOUT_PAT }}
        run: bash .github/scripts/init-submodules.sh packages apps/api apps/dashboard

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            apps/api/pnpm-lock.yaml
            apps/dashboard/pnpm-lock.yaml

      - name: Install API dependencies
        run: node tooling/scripts/install-app-with-packages.mjs apps/api

      - name: Refuse the production database
        env:
          ASSISTANT_E2E_SUPABASE_URL: ${{ secrets.ASSISTANT_E2E_SUPABASE_URL }}
          SUPABASE_PROD_PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
        run: |
          if [[ -z "$ASSISTANT_E2E_SUPABASE_URL" || -z "$SUPABASE_PROD_PROJECT_REF" ]]; then
            echo "Assistant database target is not configured. Refusing." >&2
            exit 1
          fi
          if [[ "$ASSISTANT_E2E_SUPABASE_URL" == *"$SUPABASE_PROD_PROJECT_REF"* ]]; then
            echo "Assistant CI was pointed at the production database. Refusing." >&2
            exit 1
          fi
      - name: Refuse a production API host
        working-directory: apps/api
        env:
          ASSISTANT_E2E_API_URL: ${{ secrets.ASSISTANT_E2E_API_URL }}
          ASSISTANT_E2E_SUPABASE_URL: ${{ secrets.ASSISTANT_E2E_SUPABASE_URL }}
        run: node --experimental-strip-types scripts/refuse-prod-target.ts --http ASSISTANT_E2E_API_URL --database ASSISTANT_E2E_SUPABASE_URL
      - name: Live assistant HTTP
        working-directory: apps/api
        env:
          ASSISTANT_E2E_EMAIL: ${{ secrets.ASSISTANT_E2E_EMAIL }}
          ASSISTANT_E2E_PASSWORD: ${{ secrets.ASSISTANT_E2E_PASSWORD }}
          ASSISTANT_E2E_ORG: ${{ secrets.ASSISTANT_E2E_ORG }}
          ASSISTANT_E2E_API_URL: ${{ secrets.ASSISTANT_E2E_API_URL }}
          ASSISTANT_E2E_SUPABASE_URL: ${{ secrets.ASSISTANT_E2E_SUPABASE_URL }}
          ASSISTANT_E2E_SUPABASE_ANON_KEY: ${{ secrets.ASSISTANT_E2E_SUPABASE_ANON_KEY }}
        run: pnpm synthetics:assistant

      - name: Install dashboard dependencies
        run: node tooling/scripts/install-app-with-packages.mjs apps/dashboard

      - name: Install Playwright Chromium
        working-directory: apps/dashboard
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright assistant panel
        working-directory: apps/dashboard
        env:
          ASSISTANT_E2E_EMAIL: ${{ secrets.ASSISTANT_E2E_EMAIL }}
          ASSISTANT_E2E_PASSWORD: ${{ secrets.ASSISTANT_E2E_PASSWORD }}
          ASSISTANT_E2E_ORG: ${{ secrets.ASSISTANT_E2E_ORG }}
          ASSISTANT_E2E_API_URL: ${{ secrets.ASSISTANT_E2E_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.ASSISTANT_E2E_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ASSISTANT_E2E_SUPABASE_ANON_KEY }}
        run: pnpm test:assistant:e2e
