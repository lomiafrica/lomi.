name: lomi · deploy · website

on:
  repository_dispatch:
    types: [lomi-deploy-website]
  push:
    branches: [main]
    paths:
      - "apps/website"
      - "apps/website/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tooling/scripts/install-app-with-packages.mjs"
      - "tooling/vercel/website.json"
      - ".github/workflows/app-deploy-website.yml"
      - ".github/workflows/app-deploy-vercel.yml"
      - ".github/actions/checkout-app-submodule/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        type: string
        default: main

concurrency:
  group: lomi-deploy-website-${{ github.event.client_payload.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  require-check:
    uses: ./.github/workflows/app-require-check.yml

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Load local actions
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions/checkout-app-submodule

      - name: Checkout umbrella + app source
        id: checkout-app
        uses: ./.github/actions/checkout-app-submodule
        with:
          repository: lomiafrica/website
          submodule-path: apps/website
          token: ${{ secrets.REPO_CHECKOUT_PAT }}
          event-name: ${{ github.event_name }}
          workflow-ref: ${{ inputs.ref }}
          dispatch-sha: ${{ github.event.client_payload.sha }}
          with-umbrella: "true"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ steps.checkout-app.outputs.app-path }}/pnpm-lock.yaml
      - name: Install website with workspace packages
        run: node tooling/scripts/install-app-with-packages.mjs apps/website
      - run: pnpm lint
        working-directory: ${{ steps.checkout-app.outputs.app-path }}
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Verify public OpenAPI mirrors
        run: node scripts/check/verify-public-openapi.mjs
        working-directory: ${{ steps.checkout-app.outputs.app-path }}

  deploy:
    needs: [verify, require-check]
    if: |
      github.event.client_payload.target == 'production' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/app-deploy-vercel.yml
    with:
      app: website
      repository: lomiafrica/website
      submodule-path: apps/website
      working-directory-mode: umbrella
      workflow-ref: ${{ inputs.ref }}
      vercel-target: production
    secrets:
      REPO_CHECKOUT_PAT: ${{ secrets.REPO_CHECKOUT_PAT }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEBSITE }}
