name: lomi · deploy · jumbo

on:
  push:
    branches: [main]
    paths:
      - "apps/jumbo"
      - "apps/jumbo/**"
      - "packages/shared/**"
      - "packages/queries/**"
      - "tooling/scripts/install-app-with-packages.mjs"
      - ".github/workflows/app-deploy-jumbo.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options:
          - preview
          - store
        default: preview
      platform:
        description: Platform
        type: choice
        options:
          - android
          - ios
          - all
        default: android
      submit:
        description: Upload after build (Play internal or TestFlight only)
        type: boolean
        default: false

concurrency:
  group: lomi-deploy-jumbo-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/jumbo
    env:
      PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'preview' }}
      PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'android' }}
      SUBMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.submit || false }}
    steps:
      - uses: actions/checkout@v5

      - name: Checkout jumbo submodule
        working-directory: .
        env:
          TOKEN: ${{ secrets.REPO_CHECKOUT_PAT }}
        run: bash .github/scripts/init-submodules.sh packages apps/jumbo

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            apps/jumbo/pnpm-lock.yaml
            packages/shared/package.json
            packages/queries/package.json

      - name: Install Jumbo + shared packages
        working-directory: .
        run: node tooling/scripts/install-app-with-packages.mjs apps/jumbo

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish preview OTA
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && env.PROFILE == 'preview' && env.SUBMIT != 'true')
        run: |
          msg=$(printf '%s' "${{ github.event.head_commit.message || github.sha }}" | head -n1 | cut -c1-80)
          eas update --channel preview --environment preview --non-interactive --message "$msg"
          echo "OTA preview: https://expo.dev/accounts/lomiafrica/projects/lomi/updates" >> "$GITHUB_STEP_SUMMARY"

      - name: Vendor shared packages for EAS
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/eas-vendor-packages.mjs

      - name: Assert store profile
        if: github.event_name == 'workflow_dispatch' && env.PROFILE == 'store'
        run: node scripts/assert-store-env.mjs

      - name: Write store submit secrets
        if: github.event_name == 'workflow_dispatch' && env.SUBMIT == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          EXPO_ASC_API_KEY: ${{ secrets.EXPO_ASC_API_KEY }}
        run: node scripts/write-store-submit-secrets.mjs

      - name: Gate store upload
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${SUBMIT}" != "true" ]; then
            exit 0
          fi
          if [ "${PROFILE}" != "store" ]; then
            echo "submit is only allowed with the store profile (Play internal / TestFlight)."
            exit 1
          fi
          echo "Submit profile is store. eas.json android track stays internal."

      - name: Queue EAS build
        if: github.event_name == 'workflow_dispatch'
        run: |
          extra=()
          if [ "${SUBMIT}" = "true" ]; then
            extra+=(--auto-submit-with-profile store)
          fi
          eas build --profile "${PROFILE}" --platform "${PLATFORM}" --non-interactive --no-wait --json "${extra[@]}" | tee /tmp/eas-build.json
          echo "Build dashboard: https://expo.dev/accounts/lomiafrica/projects/lomi/builds" >> "$GITHUB_STEP_SUMMARY"
          echo "Starter (~USD 20) meters iOS and Android binaries. Failed builds under 3 minutes are waived (10/month). Do not re-run this job to debug JS." >> "$GITHUB_STEP_SUMMARY"
