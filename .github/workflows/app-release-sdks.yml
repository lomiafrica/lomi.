name: lomi · release · sdks

# npm packages (@lomi./sdk, @lomi./embed) publish from app-publish-npm.yml
# via Trusted Publisher. @lomi./receipt-pdf stays private. This workflow is PyPI only.

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type (patch/minor/major) or skip
        required: false
        default: skip
        type: choice
        options:
          - skip
          - patch
          - minor
          - major

jobs:
  publish-python:
    name: Publish Python SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout Python SDK submodule
        run: bash .github/scripts/init-submodules.sh apps/sdks/python

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Bump version (if specified)
        if: inputs.version_bump != 'skip'
        working-directory: apps/sdks/python
        run: |
          python -c "
          import re
          with open('setup.py', 'r') as f:
              content = f.read()
          version = re.search(r'VERSION = \"([^\"]+)\"', content).group(1)
          major, minor, patch = map(int, version.split('.'))
          bump_type = '${{ inputs.version_bump }}'
          if bump_type == 'major':
              major += 1
              minor = 0
              patch = 0
          elif bump_type == 'minor':
              minor += 1
              patch = 0
          elif bump_type == 'patch':
              patch += 1
          new_version = f'{major}.{minor}.{patch}'
          content = content.replace(f'VERSION = \"{version}\"', f'VERSION = \"{new_version}\"')
          with open('setup.py', 'w') as f:
              f.write(content)
          print(f'Bumped version from {version} to {new_version}')
          "

      - name: Build package
        working-directory: apps/sdks/python
        run: python -m build

      - name: Check package
        working-directory: apps/sdks/python
        run: twine check dist/*

      - name: Publish to PyPI
        working-directory: apps/sdks/python
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
