name: lomi · pos · ios credential status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read iOS credential status
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node <<'EOF'
          const query = `
            query IosCredentialStatus($projectFullName: String!, $accountName: String!) {
              app {
                byFullName(fullName: $projectFullName) {
                  id
                  iosAppCredentials {
                    id
                    appleAppIdentifier { id bundleIdentifier }
                    iosAppBuildCredentialsList {
                      id
                      iosDistributionType
                      distributionCertificate {
                        id
                        serialNumber
                        validityNotBefore
                        validityNotAfter
                        developerPortalIdentifier
                      }
                    }
                  }
                }
              }
              account {
                byName(accountName: $accountName) {
                  id
                  appleDistributionCertificatesPaginated(first: 20) {
                    edges {
                      node {
                        id
                        serialNumber
                        validityNotBefore
                        validityNotAfter
                        developerPortalIdentifier
                      }
                    }
                  }
                }
              }
            }
          `;
          fetch('https://api.expo.dev/graphql', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              authorization: `Bearer ${process.env.EXPO_TOKEN}`,
            },
            body: JSON.stringify({
              query,
              variables: {
                projectFullName: '@lomiafrica/lomi',
                accountName: 'lomiafrica',
              },
            }),
          })
            .then(async (response) => {
              const text = await response.text();
              if (!response.ok) {
                console.error(`HTTP ${response.status}`);
                console.error(text.slice(0, 500));
                process.exit(1);
              }
              const json = JSON.parse(text);
              const scrubbed = JSON.parse(
                JSON.stringify(json, (key, value) => {
                  if (/p12|password|private|secret|token|keyP8/i.test(key)) return '[redacted]';
                  return value;
                }),
              );
              console.log(JSON.stringify(scrubbed, null, 2));
            })
            .catch((error) => {
              console.error(error instanceof Error ? error.message : 'request failed');
              process.exit(1);
            });
          EOF
