name: lomi · pos · ios credential status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload iOS store credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_DIST_CERT_KEY: ${{ secrets.IOS_DIST_CERT_KEY }}
          IOS_DIST_CERT_PORTAL_ID: ${{ secrets.IOS_DIST_CERT_PORTAL_ID }}
          IOS_PROFILE_CONTENT: ${{ secrets.IOS_PROFILE_CONTENT }}
          IOS_PROFILE_PORTAL_ID: ${{ secrets.IOS_PROFILE_PORTAL_ID }}
        run: |
          node <<'EOF'
          const accountId = '8476e26b-34b1-4ae5-b765-d994444bdbf8';
          const appId = 'bc56e88f-5bce-4171-85ae-772ea2519d62';
          const teamIdentifier = 'QKMJV6597D';

          const scrub = (value) =>
            JSON.parse(
              JSON.stringify(value, (key, item) => {
                if (/p12|password|private|secret|token|keyP8|profileContent|cert/i.test(key) && typeof item === 'string' && item.length > 80) {
                  return '[redacted]';
                }
                return item;
              }),
            );

          async function gql(query, variables) {
            const response = await fetch('https://api.expo.dev/graphql', {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                authorization: `Bearer ${process.env.EXPO_TOKEN}`,
              },
              body: JSON.stringify({ query, variables }),
            });
            const json = await response.json();
            if (!response.ok || json.errors) {
              console.error(JSON.stringify(scrub({ status: response.status, errors: json.errors }), null, 2));
              throw new Error('graphql failed');
            }
            return json.data;
          }

          const existing = await gql(
            `query Existing($projectFullName: String!) {
              app { byFullName(fullName: $projectFullName) {
                id
                iosAppCredentials {
                  appleAppIdentifier { bundleIdentifier }
                  iosAppBuildCredentialsList {
                    iosDistributionType
                    distributionCertificate { id developerPortalIdentifier }
                  }
                }
              } }
            }`,
            { projectFullName: '@lomiafrica/lomi' },
          );
          const already = existing.app.byFullName.iosAppCredentials.some((row) =>
            row.iosAppBuildCredentialsList?.some(
              (build) => build.iosDistributionType === 'APP_STORE' && build.distributionCertificate,
            ),
          );
          if (already) {
            console.log('App Store credentials already assigned.');
            process.exit(0);
          }

          const team = await gql(
            `mutation CreateTeam($input: AppleTeamInput!, $accountId: ID!) {
              appleTeam { createAppleTeam(appleTeamInput: $input, accountId: $accountId) { id appleTeamIdentifier } }
            }`,
            { accountId, input: { appleTeamIdentifier: teamIdentifier, appleTeamName: 'Babacar Diop' } },
          );
          const appleTeamId = team.appleTeam.createAppleTeam.id;

          const appIdentifier = await gql(
            `mutation CreateAppId($input: AppleAppIdentifierInput!, $accountId: ID!) {
              appleAppIdentifier { createAppleAppIdentifier(appleAppIdentifierInput: $input, accountId: $accountId) { id bundleIdentifier } }
            }`,
            { accountId, input: { bundleIdentifier: 'africa.lomi.pos', appleTeamId } },
          );
          const appleAppIdentifierId = appIdentifier.appleAppIdentifier.createAppleAppIdentifier.id;

          const certificate = await gql(
            `mutation CreateCert($input: AppleDistributionCertificateInput!, $accountId: ID!) {
              appleDistributionCertificate { createAppleDistributionCertificate(appleDistributionCertificateInput: $input, accountId: $accountId) { id developerPortalIdentifier } }
            }`,
            {
              accountId,
              input: {
                certP12: process.env.IOS_DIST_CERT_P12,
                certPassword: process.env.IOS_DIST_CERT_PASSWORD,
                certPrivateSigningKey: process.env.IOS_DIST_CERT_KEY,
                developerPortalIdentifier: process.env.IOS_DIST_CERT_PORTAL_ID,
                appleTeamId,
              },
            },
          );
          const distributionCertificateId = certificate.appleDistributionCertificate.createAppleDistributionCertificate.id;

          const profile = await gql(
            `mutation CreateProfile($input: AppleProvisioningProfileInput!, $accountId: ID!, $appleAppIdentifierId: ID!) {
              appleProvisioningProfile { createAppleProvisioningProfile(appleProvisioningProfileInput: $input, accountId: $accountId, appleAppIdentifierId: $appleAppIdentifierId) { id } }
            }`,
            {
              accountId,
              appleAppIdentifierId,
              input: {
                appleProvisioningProfile: process.env.IOS_PROFILE_CONTENT,
                developerPortalIdentifier: process.env.IOS_PROFILE_PORTAL_ID,
              },
            },
          );
          const provisioningProfileId = profile.appleProvisioningProfile.createAppleProvisioningProfile.id;

          const credentials = await gql(
            `mutation CreateIosCreds($input: IosAppCredentialsInput!, $appId: ID!, $appleAppIdentifierId: ID!) {
              iosAppCredentials { createIosAppCredentials(iosAppCredentialsInput: $input, appId: $appId, appleAppIdentifierId: $appleAppIdentifierId) { id } }
            }`,
            { appId, appleAppIdentifierId, input: { appleTeamId } },
          );
          const iosAppCredentialsId = credentials.iosAppCredentials.createIosAppCredentials.id;

          const build = await gql(
            `mutation CreateBuildCreds($input: IosAppBuildCredentialsInput!, $iosAppCredentialsId: ID!) {
              iosAppBuildCredentials { createIosAppBuildCredentials(iosAppBuildCredentialsInput: $input, iosAppCredentialsId: $iosAppCredentialsId) { id iosDistributionType } }
            }`,
            {
              iosAppCredentialsId,
              input: {
                iosDistributionType: 'APP_STORE',
                distributionCertificateId,
                provisioningProfileId,
              },
            },
          );
          console.log(JSON.stringify({
            appleTeamId,
            appleAppIdentifierId,
            distributionCertificateId,
            provisioningProfileId,
            iosAppCredentialsId,
            buildCredentialsId: build.iosAppBuildCredentials.createIosAppBuildCredentials.id,
          }, null, 2));
          EOF
