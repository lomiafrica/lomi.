name: lomi · release · bubble

on:
  push:
    tags:
      - "bubble-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Initialize Bubble plugin submodule
        run: bash .github/scripts/init-submodules.sh apps/plugins/bubble

      - name: Run plugin parity checks
        run: apps/plugins/scripts/verify-lomi-plugins.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/sdks/embed/pnpm-lock.yaml

      - name: Validate Bubble plugin JSON
        run: |
          find apps/plugins/bubble -name '*.json' -print0 | xargs -0 -I{} node -e "JSON.parse(require('fs').readFileSync('{}','utf8'))"

      - name: Build embed asset
        run: |
          cd apps/sdks/embed
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm run build:iife
          node ../../plugins/bubble/scripts/build-assets.mjs

      - name: API smoke test
        env:
          LOMI_SECRET_KEY: ${{ secrets.LOMI_SECRET_KEY }}
        run: |
          if [ -z "$LOMI_SECRET_KEY" ]; then
            echo "SKIP: LOMI_SECRET_KEY not set — API smoke test is optional for tag releases"
            echo "Set the org secret to require GET /me + POST /checkout-sessions on every bubble-v* release"
            exit 0
          fi
          node apps/plugins/bubble/scripts/smoke-test.mjs

  release:
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/bubble-v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - name: Initialize Bubble plugin submodule
        run: bash .github/scripts/init-submodules.sh apps/plugins/bubble

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Bubble plugin release

            1. Open the Bubble Plugin Editor for **lomi.**
            2. Go to **Version → Synchronize with GitHub**
            3. Pull this tag (`bubble-v*`) from [`lomiafrica/bubble`](https://github.com/lomiafrica/bubble)
            4. Test in a version-test app with sandbox keys before promoting to live

            No zip artifact — Bubble pulls plugin files directly from GitHub.

            Merchant setup: [docs.lomi.africa/build/ecommerce-extensions/bubble](https://docs.lomi.africa/build/ecommerce-extensions/bubble)
