name: lomi · ci · agent-plugin

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/tools/agent-plugin"
      - "apps/tools/agent-plugin/**"
      - ".gitmodules"
      - ".github/workflows/app-ci-agent-plugin.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/tools/agent-plugin"
      - "apps/tools/agent-plugin/**"
      - ".gitmodules"
      - ".github/workflows/app-ci-agent-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Init agent-plugin
        run: bash .github/scripts/init-submodules.sh apps/tools/agent-plugin
      - name: Validate manifests
        run: node apps/tools/agent-plugin/scripts/validate.mjs
