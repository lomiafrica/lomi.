name: lomi · check · supabase · admin rpc

# Daily drift check (same cadence as grants). Also on migration PRs.
on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "apps/dashboard/supabase/migrations/**"
      - ".github/scripts/check-anon-admin-rpc-execute.mjs"
      - ".github/scripts/apt-with-retry.sh"
      - ".github/actions/setup-ipv6-warp/**"
      - ".github/workflows/app-check-supabase-admin-rpc.yml"
  pull_request:
    paths:
      - "apps/dashboard/supabase/migrations/**"
      - ".github/scripts/check-anon-admin-rpc-execute.mjs"
      - ".github/scripts/apt-with-retry.sh"
      - ".github/actions/setup-ipv6-warp/**"
      - ".github/workflows/app-check-supabase-admin-rpc.yml"

jobs:
  admin-rpc-check:
    name: admin-rpc-check (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [prod, test]
    env:
      TARGET: ${{ matrix.target }}
      SUPABASE_DB_URL: ${{ matrix.target == 'prod' && secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_TEST_URL }}
      EXPECTED_PROJECT_REF: ${{ matrix.target == 'prod' && secrets.SUPABASE_PROD_PROJECT_REF || secrets.SUPABASE_TEST_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5

      # GitHub runners are IPv4-only; Supabase pooler is flaky (EAUTHQUERY).
      # Direct db.<ref>.supabase.co is IPv6-only — WARP provides IPv6 egress.
      - name: Set up IPv6 egress
        uses: ./.github/actions/setup-ipv6-warp

      - name: Install PostgreSQL client
        run: bash .github/scripts/apt-with-retry.sh postgresql-client

      - name: Resolve direct database URL
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set"
            exit 2
          fi

          url="$(printf '%s' "$SUPABASE_DB_URL" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          rest="${url#*://}"
          userinfo="${rest%%@*}"
          hostpath="${rest#*@}"
          user="${userinfo%%:*}"
          pass="${userinfo#*:}"
          hostport="${hostpath%%/*}"
          dbname="${hostpath#*/}"
          dbname="${dbname%%\?*}"
          host="${hostport%%:*}"
          [ -n "$dbname" ] || dbname="postgres"

          case "$host" in
            *.pooler.supabase.com)
              ref="${user#*.}"
              db_url="postgresql://postgres:${pass}@db.${ref}.supabase.co:5432/${dbname}"
              echo "::notice::Pooler host detected; using direct IPv6 connection db.${ref}.supabase.co:5432."
              ;;
            *)
              db_url="$url"
              echo "::notice::Using SUPABASE_DB_URL host ${host} as-is."
              ;;
          esac

          if [ -z "${EXPECTED_PROJECT_REF:-}" ]; then
            echo "::error::Project ref secret is not set for the ${TARGET} admin RPC check."
            exit 2
          fi
          case "$db_url" in
            *"$EXPECTED_PROJECT_REF"*) ;;
            *)
              echo "::error::${TARGET} database URL does not contain its project ref. Refusing to check the wrong database."
              exit 2
              ;;
          esac

          echo "::add-mask::$pass"
          echo "::add-mask::$db_url"
          printf 'SUPABASE_DB_URL=%s\n' "$db_url" >> "$GITHUB_ENV"

      - name: Check anon/PUBLIC cannot execute admin RPCs
        id: admin_rpc
        run: |
          set -euo pipefail
          set +e
          node .github/scripts/check-anon-admin-rpc-execute.mjs
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Notify Slack on drift
        if: failure() && steps.admin_rpc.outputs.exit_code == '1'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL not set; skipping notification"
            exit 0
          fi
          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"Supabase admin RPC EXECUTE drift on ${TARGET} (${GITHUB_REPOSITORY}, ${GITHUB_REF_NAME}). See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
