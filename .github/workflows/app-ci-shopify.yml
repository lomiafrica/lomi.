name: lomi · ci · shopify

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/plugins/shopify/**"
      - ".github/workflows/app-ci-shopify.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/plugins/shopify/**"
      - ".github/workflows/app-ci-shopify.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/plugins/shopify
    env:
      SHOPIFY_API_KEY: ci-test-api-key
      SHOPIFY_API_SECRET: ci-test-api-secret
      SHOPIFY_APP_URL: https://connect.lomi.africa
      SHOPIFY_SCOPES: read_checkouts,read_orders,write_checkouts,write_orders,write_products
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-test-service-role-key
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Initialize Shopify plugin submodule
        working-directory: ${{ github.workspace }}
        env:
          TOKEN: ${{ secrets.REPO_CHECKOUT_PAT }}
        run: bash .github/scripts/init-submodules.sh apps/plugins/shopify

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/plugins/shopify/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        env:
          # Lockfile was written with a different pnpm overrides encoding
          # than Actions pnpm 9; supabase-js 2.x also wants Node 22 while
          # this app is pinned to Node 20.
          PNPM_NO_FROZEN_LOCKFILE: "1"
          PNPM_IGNORE_ENGINES: "1"
        run: node tooling/scripts/install-app-with-packages.mjs apps/plugins/shopify

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
