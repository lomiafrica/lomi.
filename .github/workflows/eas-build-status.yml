name: lomi · eas · build status

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: EAS build id
        required: true
        type: string

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Build status
        env:
          BUILD_ID: ${{ inputs.build_id }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet brotli
          cat > /tmp/eas-query.json << 'JSON'
          {
            "query": "query BuildsById($buildId: ID!) { builds { byId(buildId: $buildId) { id status platform appVersion appBuildVersion distribution buildProfile gitCommitHash error { errorCode message } logFiles artifacts { buildUrl applicationArchiveUrl } } } }"
          }
          JSON
          python3 - << 'PY'
          import json
          import os
          query = json.load(open("/tmp/eas-query.json"))
          query["variables"] = {"buildId": os.environ["BUILD_ID"]}
          json.dump(query, open("/tmp/eas-query.json", "w"))
          PY
          code=$(curl -sS -o /tmp/eas-build-view.json -w "%{http_code}" \
            -H "Authorization: Bearer ${EXPO_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data @/tmp/eas-query.json \
            "https://api.expo.dev/graphql")
          echo "HTTP ${code}"
          if [ "$code" != "200" ]; then
            python3 - << 'PY'
          import json
          raw = open("/tmp/eas-build-view.json").read()
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              print(raw[:180])
              raise SystemExit(1)
          errors = data.get("errors") or []
          if errors:
              print(errors[0].get("message", "graphql error"))
          else:
              print(data.get("message") or "request failed")
          PY
            exit 1
          fi
          python3 - << 'PY'
          import brotli, gzip, json, os, urllib.error, urllib.request, zlib
          from urllib.parse import urlparse
          data = json.load(open("/tmp/eas-build-view.json"))
          errors = data.get("errors") or []
          if errors:
              print(errors[0].get("message", "graphql error"))
              raise SystemExit(1)
          build = data["data"]["builds"]["byId"]
          safe = {
              "id": build.get("id"),
              "status": build.get("status"),
              "platform": build.get("platform"),
              "appVersion": build.get("appVersion"),
              "appBuildVersion": build.get("appBuildVersion"),
              "distribution": build.get("distribution"),
              "buildProfile": build.get("buildProfile"),
              "gitCommitHash": build.get("gitCommitHash"),
              "error": (build.get("error") or {}).get("message"),
          }
          print(json.dumps(safe))
          artifacts = build.get("artifacts") or {}
          url = artifacts.get("applicationArchiveUrl") or artifacts.get("buildUrl")
          if url:
              parsed = urlparse(url)
              print("archive host", parsed.netloc)
              print("archive path", parsed.path)
              request = urllib.request.Request(url, headers={"User-Agent": "eas-cli"})
              try:
                  with urllib.request.urlopen(request) as response:
                      open("/tmp/lomi-pos.aab", "wb").write(response.read())
                  print("Downloaded archive bytes:", os.path.getsize("/tmp/lomi-pos.aab"))
              except urllib.error.HTTPError as err:
                  print("archive http", err.code)
          else:
              print("No archive yet.")
          artifacts.pop("applicationArchiveUrl", None)
          artifacts.pop("buildUrl", None)
          logs = build.get("logFiles") or []
          build["logFiles"] = [type(item).__name__ for item in logs]
          json.dump(build, open("/tmp/eas-build-view.json", "w"))
          print("log file count", len(logs))
          chunks = []
          for index, item in enumerate(logs):
              log_url = item if isinstance(item, str) else (item or {}).get("url") or (item or {}).get("downloadUrl")
              if not log_url:
                  chunks.append(f"log {index} keys {list((item or {}).keys()) if isinstance(item, dict) else type(item).__name__}")
                  continue
              with urllib.request.urlopen(log_url) as response:
                  chunks.append(
                      "content-type "
                      + response.headers.get("Content-Type", "")
                      + " encoding "
                      + response.headers.get("Content-Encoding", "")
                  )
                  raw = response.read()
                  if response.headers.get("Content-Encoding") == "br":
                      raw = brotli.decompress(raw)
              chunks.append(f"log {index} bytes {len(raw)} magic {raw[:8].hex()}")
              strings = []
              current = bytearray()
              for byte in raw:
                  if 32 <= byte < 127:
                      current.append(byte)
                  elif len(current) >= 10:
                      strings.append(current.decode())
                      current = bytearray()
                  else:
                      current = bytearray()
              picked = [s for s in strings if any(token in s.lower() for token in ("fail", "error", "exception", "gradle", "manifest", "permission"))]
              chunks.append("\n".join(picked[:40]))
              if raw[:2] == b"\x1f\x8b":
                  raw = gzip.decompress(raw)
              elif raw[:2] in (b"\x78\x9c", b"\x78\xda", b"\x78\x01"):
                  raw = zlib.decompress(raw)
              text_log = raw.decode("utf-8", "replace")
              lines = text_log.splitlines()
              hits = []
              for i, line in enumerate(lines):
                  low = line.lower()
                  if any(token in low for token in ("failure:", "what went wrong", "execution failed", "a problem occurred")):
                      hits.extend(lines[max(0, i - 1): i + 12])
                      hits.append("---")
              chunks.append(f"log {index} lines {len(lines)} hits {len(hits)}")
              chunks.extend(hits[-60:] or [line for line in lines[-30:] if line.isascii()])
              chunks.append("---")
          text = "\n".join(chunks) or "No log files."
          open("/tmp/eas-gradle-errors.txt", "w").write(text)
          print(text[-6000:])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eas-build-view
          path: |
            /tmp/eas-build-view.json
            /tmp/lomi-pos.aab
            /tmp/eas-gradle-errors.txt
          if-no-files-found: warn
