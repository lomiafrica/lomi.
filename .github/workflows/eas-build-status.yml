name: lomi · eas · build status

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: EAS build id
        required: true
        type: string

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Build status
        env:
          BUILD_ID: ${{ inputs.build_id }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/eas-build-view.json -w "%{http_code}" \
            -H "Authorization: Bearer ${EXPO_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.expo.dev/v2/builds/${BUILD_ID}")
          echo "HTTP ${code}"
          if [ "$code" != "200" ]; then
            jq -r '.message // .error // "request failed"' /tmp/eas-build-view.json
            exit 1
          fi
          jq '{id,status,platform,appVersion,appBuildVersion,distribution,buildProfile,gitCommitHash,error:(.error.message // null)}' /tmp/eas-build-view.json
          url=$(jq -r '.artifacts.applicationArchiveUrl // .artifacts.buildUrl // empty' /tmp/eas-build-view.json)
          if [ -n "$url" ]; then
            curl -fsSL "$url" -o /tmp/lomi-pos.aab
            echo "Downloaded archive bytes: $(wc -c < /tmp/lomi-pos.aab)"
          else
            echo "No archive yet."
          fi
          jq 'del(.artifacts.applicationArchiveUrl, .artifacts.buildUrl)' /tmp/eas-build-view.json > /tmp/eas-build-view.redacted.json
          mv /tmp/eas-build-view.redacted.json /tmp/eas-build-view.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eas-build-view
          path: |
            /tmp/eas-build-view.json
            /tmp/lomi-pos.aab
          if-no-files-found: warn
