name: lomi · eas · build status

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: EAS build id
        required: true
        type: string

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build status
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set +e
          eas build:view "$BUILD_ID" --json > /tmp/eas-build-view.json 2> /tmp/eas-build-view.err
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "eas build:view exited $code"
            # Error text only. Do not print the JSON, which can contain an archive URL.
            sed -E 's/(eyJ[A-Za-z0-9_-]{12,})/[redacted]/g' /tmp/eas-build-view.err
            exit "$code"
          fi

      - name: Publish status
        run: |
          jq '{id,status,platform,appVersion,appBuildVersion,distribution,buildProfile,gitCommitHash,error:.error.message}' /tmp/eas-build-view.json
          jq -r '.artifacts.applicationArchiveUrl // empty' /tmp/eas-build-view.json > /tmp/archive-url.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eas-build-view
          path: |
            /tmp/eas-build-view.json
            /tmp/archive-url.txt
