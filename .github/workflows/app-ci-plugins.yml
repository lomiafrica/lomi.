name: lomi · ci · plugins

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/plugins/**"
      - ".github/workflows/app-ci-plugins.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/plugins/**"
      - ".github/workflows/app-ci-plugins.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Initialize plugin submodules
        run: bash .github/scripts/init-submodules.sh apps/plugins/woo apps/plugins/prestashop apps/plugins/magento

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/plugins/woo/pnpm-lock.yaml

      - name: Run automated plugin test suite
        run: apps/plugins/scripts/run-plugin-tests.sh
