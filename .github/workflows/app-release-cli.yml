name: lomi · release · cli

on:
  push:
    branches: [main]
    paths:
      - apps/cli/Cargo.toml
      - apps/cli/npm/package.json
      - apps/cli/src/**
      - .github/workflows/app-release-cli.yml
    tags:
      - "cli-v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  REPO_DIR: src

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      skip: ${{ steps.meta.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: ${{ env.REPO_DIR }}

      - id: meta
        working-directory: ${{ env.REPO_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VER="$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/cli/Cargo.toml | head -1)"
          NPM_VER="$(node -p "require('./apps/cli/npm/package.json').version")"
          if [[ "${{ github.ref }}" == refs/tags/cli-v* ]]; then
            VER="${GITHUB_REF_NAME#cli-v}"
          else
            VER="$CARGO_VER"
          fi
          if [[ "$CARGO_VER" != "$NPM_VER" ]]; then
            echo "Cargo.toml ($CARGO_VER) and apps/cli/npm ($NPM_VER) versions must match" >&2
            exit 1
          fi
          if [[ "$VER" != "$CARGO_VER" ]]; then
            echo "Tag version ($VER) does not match Cargo.toml ($CARGO_VER)" >&2
            exit 1
          fi
          TAG="cli-v${VER}"
          SKIP=false
          if npm view "lomi.cli@${VER}" version >/dev/null 2>&1; then
            echo "lomi.cli@${VER} already on npm"
            SKIP=true
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: lomi-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: lomi-aarch64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: lomi-x86_64-unknown-linux-gnu
          # Windows omitted until checkout works with repo name "lomi." (see #cli-release)

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: ${{ env.REPO_DIR }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Generate rules (OpenAPI + llms.txt)
        working-directory: ${{ env.REPO_DIR }}/apps/cli
        shell: bash
        run: ./scripts/generate/generate-rules.sh

      - name: Build
        working-directory: ${{ env.REPO_DIR }}/apps/cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage release binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "${{ env.REPO_DIR }}/apps/cli/target/${{ matrix.target }}/release/lomi.exe" "dist/${{ matrix.asset }}"
          else
            cp "${{ env.REPO_DIR }}/apps/cli/target/${{ matrix.target }}/release/lomi" "dist/${{ matrix.asset }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && needs.version.outputs.skip != 'true' && needs.build.result == 'success'
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true

  publish-npm:
    needs: [version, release]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && needs.version.outputs.skip != 'true' && needs.release.result == 'success'
    defaults:
      run:
        working-directory: ${{ env.REPO_DIR }}/apps/cli/npm
    steps:
      - uses: actions/checkout@v5
        with:
          path: ${{ env.REPO_DIR }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Latest npm (OIDC trusted publishing)
        run: npm install -g npm@latest
        working-directory: ${{ env.REPO_DIR }}

      - name: Sync npm version
        run: npm pkg set version="${{ needs.version.outputs.version }}"

      - name: Verify release binaries exist on GitHub
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          for asset in lomi-x86_64-apple-darwin lomi-aarch64-apple-darwin lomi-x86_64-unknown-linux-gnu; do
            echo "Checking ${BASE}/${asset}"
            curl -sfI "${BASE}/${asset}" | head -1
          done

      - name: Publish to npm
        run: npm publish --access public
