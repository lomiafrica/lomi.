name: lomi · deploy · dashboard

on:
  repository_dispatch:
    types: [lomi-deploy-dashboard]
  push:
    branches: [main]
    paths:
      - "apps/dashboard"
      - "apps/dashboard/**"
      - "apps/api"
      - "apps/api/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tooling/scripts/install-app-with-packages.mjs"
      - ".github/workflows/app-deploy-cloudflare.yml"
      - ".github/workflows/app-deploy-dashboard.yml"
      - ".github/actions/checkout-app-submodule/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        type: string
        default: main
        description: Vercel target (preview or production)
        type: choice
        options:
          - production
          - preview
        default: production

concurrency:
  group: lomi-deploy-dashboard-${{ github.event.client_payload.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/app-deploy-cloudflare.yml
    with:
      app: dashboard
      repository: lomiafrica/dashboard
      submodule-path: apps/dashboard
      working-directory-mode: umbrella
      deploy-kind: static
      pnpm-version: "10"
      extra-submodules: apps/api
      workflow-ref: ${{ inputs.ref }}
    secrets:
      REPO_CHECKOUT_PAT: ${{ secrets.REPO_CHECKOUT_PAT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
