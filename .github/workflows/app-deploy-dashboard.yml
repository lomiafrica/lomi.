name: lomi · deploy · dashboard

on:
  repository_dispatch:
    types: [lomi-deploy-dashboard]
  push:
    branches: [main]
    paths:
      - "apps/dashboard"
      - "apps/dashboard/**"
      - "apps/api"
      - "apps/api/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tooling/scripts/install-app-with-packages.mjs"
      - "tooling/vercel/dashboard.json"
      - ".github/workflows/app-deploy-dashboard.yml"
      - ".github/workflows/app-deploy-vercel.yml"
      - ".github/actions/checkout-app-submodule/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        type: string
        default: main
      vercel-target:
        description: Vercel target (preview or production)
        type: choice
        options:
          - preview
          - production
        default: preview

concurrency:
  group: lomi-deploy-dashboard-${{ github.event.client_payload.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/app-deploy-vercel.yml
    with:
      app: dashboard
      repository: lomiafrica/dashboard
      submodule-path: apps/dashboard
      working-directory-mode: umbrella
      extra-submodules: apps/api
      workflow-ref: ${{ inputs.ref }}
      vercel-target: ${{ inputs.vercel-target }}
    secrets:
      REPO_CHECKOUT_PAT: ${{ secrets.REPO_CHECKOUT_PAT }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DASHBOARD }}
