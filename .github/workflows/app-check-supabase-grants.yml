name: lomi · check · supabase · grants

on:
  schedule:
    # Daily 07:00 UTC — catch authenticated GRANT drift before merchants do
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "apps/dashboard"
      - "apps/dashboard/**"
      - ".github/scripts/check-authenticated-grants.mjs"
      - ".github/workflows/app-check-supabase-grants.yml"
  pull_request:
    paths:
      - "apps/dashboard"
      - "apps/dashboard/**"
      - ".github/scripts/check-authenticated-grants.mjs"
      - ".github/workflows/app-check-supabase-grants.yml"

jobs:
  grants-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout monorepo (script)
        uses: actions/checkout@v5

      - name: Checkout dashboard (enable_rls.sql)
        uses: actions/checkout@v5
        with:
          repository: lomiafrica/dashboard
          ref: main
          token: ${{ secrets.REPO_CHECKOUT_PAT }}
          path: apps/dashboard

      # GitHub runners are IPv4-only; Supabase pooler is flaky (EAUTHQUERY).
      # Direct db.<ref>.supabase.co is IPv6-only — WARP provides IPv6 egress.
      - name: Set up IPv6 egress
        uses: ./.github/actions/setup-ipv6-warp

      - name: Install psql client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Resolve direct database URL
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set"
            exit 2
          fi

          url="$(printf '%s' "$SUPABASE_DB_URL" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          rest="${url#*://}"
          userinfo="${rest%%@*}"
          hostpath="${rest#*@}"
          user="${userinfo%%:*}"
          pass="${userinfo#*:}"
          hostport="${hostpath%%/*}"
          dbname="${hostpath#*/}"
          dbname="${dbname%%\?*}"
          host="${hostport%%:*}"
          [ -n "$dbname" ] || dbname="postgres"

          case "$host" in
            *.pooler.supabase.com)
              ref="${user#*.}"
              db_url="postgresql://postgres:${pass}@db.${ref}.supabase.co:5432/${dbname}"
              echo "::notice::Pooler host detected; using direct IPv6 connection db.${ref}.supabase.co:5432."
              ;;
            *)
              db_url="$url"
              echo "::notice::Using SUPABASE_DB_URL host ${host} as-is."
              ;;
          esac

          echo "::add-mask::$pass"
          echo "::add-mask::$db_url"
          printf 'SUPABASE_DB_URL=%s\n' "$db_url" >> "$GITHUB_ENV"

      - name: Check authenticated table grants
        id: grants
        env:
          ENABLE_RLS_SQL: apps/dashboard/supabase/migrations/20240828000040_enable_rls.sql
        run: |
          set -euo pipefail
          if [ ! -f "$ENABLE_RLS_SQL" ]; then
            echo "::error::Missing $ENABLE_RLS_SQL after dashboard checkout (is REPO_CHECKOUT_PAT valid?)"
            exit 2
          fi
          set +e
          node .github/scripts/check-authenticated-grants.mjs
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Notify Slack on grant drift
        if: failure() && steps.grants.outputs.exit_code == '1'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL not set; skipping notification"
            exit 0
          fi
          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"Supabase authenticated GRANT drift detected on ${GITHUB_REPOSITORY} (${GITHUB_REF_NAME}). Merchants may see 403 / 42501 permission denied. See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
