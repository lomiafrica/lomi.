name: lomi · deploy · customers

on:
  repository_dispatch:
    types: [lomi-deploy-customers]
  push:
    branches: [main]
    paths:
      - "apps/customers"
      - "apps/customers/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tooling/scripts/install-app-with-packages.mjs"
      - "tooling/vercel/customers.json"
      - ".github/workflows/app-deploy-customers.yml"
      - ".github/workflows/app-deploy-vercel.yml"
      - ".github/actions/checkout-app-submodule/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        type: string
        default: main

concurrency:
  group: lomi-deploy-customers-${{ github.event.client_payload.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/app-deploy-vercel.yml
    with:
      app: customers
      repository: lomiafrica/customers
      submodule-path: apps/customers
      working-directory-mode: umbrella
      workflow-ref: ${{ inputs.ref }}
    secrets:
      REPO_CHECKOUT_PAT: ${{ secrets.REPO_CHECKOUT_PAT }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CUSTOMERS }}
