name: lomi · release · woo

on:
  push:
    tags:
      - 'woo-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Initialize WooCommerce plugin submodule
        run: bash .github/scripts/init-submodules.sh apps/plugins/woo

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/plugins/woo/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/plugins/woo
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Build plugin assets
        working-directory: apps/plugins/woo
        run: |
          pnpm run build
          pnpm run i18n

      - name: Package release zip
        working-directory: apps/plugins/woo
        run: |
          chmod +x scripts/release.sh
          ./scripts/release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: woo-lomi
          path: apps/plugins/woo/dist/woo-lomi.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: always() && !cancelled() && (startsWith(github.ref, 'refs/tags/woo-v') || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: woo-lomi
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/woo-lomi.zip
          generate_release_notes: true
