name: lomi · ci · nomad

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clone Nomad
        env:
          TOKEN: ${{ secrets.REPO_CHECKOUT_PAT }}
        run: |
          rm -rf apps/nomad
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/princemuichkine/nomad.git" apps/nomad

      - name: Checkout packages submodule
        env:
          TOKEN: ${{ secrets.REPO_CHECKOUT_PAT }}
        run: bash .github/scripts/init-submodules.sh packages

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/nomad/pnpm-lock.yaml

      - name: Test
        working-directory: apps/nomad
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
