name: lomi · deploy · storefront

on:
  repository_dispatch:
    types: [lomi-deploy-storefront]
  push:
    branches: [main]
    paths:
      - "apps/storefront"
      - "apps/storefront/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tooling/scripts/install-app-with-packages.mjs"
      - "tooling/vercel/storefront.json"
      - ".github/workflows/app-deploy-storefront.yml"
      - ".github/workflows/app-deploy-vercel.yml"
      - ".github/actions/checkout-app-submodule/**"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy
        type: string
        default: main

concurrency:
  group: lomi-deploy-storefront-${{ github.event.client_payload.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  require-check:
    uses: ./.github/workflows/app-require-check.yml

  deploy:
    needs: require-check
    uses: ./.github/workflows/app-deploy-vercel.yml
    with:
      app: storefront
      repository: lomiafrica/storefront
      submodule-path: apps/storefront
      working-directory-mode: umbrella
      workflow-ref: ${{ inputs.ref }}
    secrets:
      REPO_CHECKOUT_PAT: ${{ secrets.REPO_CHECKOUT_PAT }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_STOREFRONT }}
