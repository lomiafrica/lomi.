name: lomi · security · dependency audit

# Full installs are expensive: run on lockfile changes, weekly, or manually.
# dashboard/checkout live in private submodule repos — check them out explicitly.
on:
  push:
    branches: [main, develop]
    paths:
      - "apps/api"
      - "apps/dashboard/pnpm-lock.yaml"
      - "apps/checkout/pnpm-lock.yaml"
      - ".github/workflows/app-security-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api"
      - "apps/dashboard/pnpm-lock.yaml"
      - "apps/checkout/pnpm-lock.yaml"
      - ".github/workflows/app-security-audit.yml"
  schedule:
    - cron: "30 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - name: Checkout API submodule
        uses: actions/checkout@v5
        with:
          repository: lomiafrica/api
          ref: main
          token: ${{ secrets.REPO_CHECKOUT_PAT }}
          path: apps/api
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml
      - name: pnpm audit (high and critical)
        run: pnpm --ignore-workspace audit --audit-level high

  audit-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v5
      - name: Checkout dashboard submodule
        uses: actions/checkout@v5
        with:
          repository: lomiafrica/dashboard
          ref: main
          token: ${{ secrets.REPO_CHECKOUT_PAT }}
          path: apps/dashboard
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml
      - name: pnpm audit (high and critical)
        run: pnpm --ignore-workspace audit --audit-level high

  audit-checkout:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/checkout
    steps:
      - uses: actions/checkout@v5
      - name: Checkout checkout submodule
        uses: actions/checkout@v5
        with:
          repository: lomiafrica/checkout
          ref: main
          token: ${{ secrets.REPO_CHECKOUT_PAT }}
          path: apps/checkout
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/checkout/pnpm-lock.yaml
      - name: pnpm audit (high and critical)
        run: pnpm --ignore-workspace audit --audit-level high
