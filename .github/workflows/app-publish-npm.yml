name: lomi · publish · npm

on:
  push:
    branches: [main]
    paths:
      - apps/sdks/ts/package.json
      - apps/sdks/ts/src/**
      - apps/sdks/embed/package.json
      - apps/sdks/embed/src/**
      - .github/workflows/app-publish-npm.yml
      - .github/scripts/npm-publish-if-new.sh
  workflow_dispatch:
    inputs:
      package:
        description: Which npm package to publish
        required: true
        type: choice
        default: all
        options:
          - all
          - sdk
          - embed

permissions:
  id-token: write
  contents: read

jobs:
  publish-sdk:
    name: Publish @lomi./sdk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'sdk'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: apps/sdks/ts/pnpm-lock.yaml

      - name: Latest npm (OIDC trusted publishing)
        run: npm install -g npm@latest

      - name: Install and build
        working-directory: apps/sdks/ts
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm run build

      - name: Publish if version is new
        run: bash .github/scripts/npm-publish-if-new.sh apps/sdks/ts

  publish-embed:
    name: Publish @lomi./embed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || inputs.package == 'all' || inputs.package == 'embed'
    steps:
      - uses: actions/checkout@v5

      - name: Checkout workspace packages
        env:
          REPO_CHECKOUT_PAT: ${{ secrets.REPO_CHECKOUT_PAT }}
        run: bash .github/scripts/init-submodules.sh packages

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: apps/sdks/embed/pnpm-lock.yaml

      - name: Latest npm (OIDC trusted publishing)
        run: npm install -g npm@latest

      - name: Install, test, and build
        run: |
          pnpm --dir packages/shared install --ignore-workspace --frozen-lockfile
          pnpm --dir packages/shared run build
          pnpm --dir apps/sdks/embed install --ignore-workspace --frozen-lockfile
          pnpm --dir apps/sdks/embed test
          pnpm --dir apps/sdks/embed run build

      - name: Publish if version is new
        run: bash .github/scripts/npm-publish-if-new.sh apps/sdks/embed
