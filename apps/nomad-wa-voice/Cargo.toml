[package]
name = "hermes-wa-voice"
version = "0.2.2"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "WhatsApp voice-call sidecar for Nomad: bridges linked-device calls to Gemini Live and the lomi assistant"
repository = "https://github.com/ashwanthbalakrishnan5/hermes-whatsapp-voice"
publish = false

[dependencies]
# Pinned: the VoIP API moves quickly upstream.
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "135e1aebf9d62c06da17ae4516a90554a472c60e", features = ["voip"] }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.22"
env_logger = "0.11"
log = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.53", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[profile.release]
lto = "thin"
strip = true
